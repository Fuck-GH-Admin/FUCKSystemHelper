name: Independent v3 signature verification
on:
  push:
    paths:
      - "tools/verify_v3_signers.py"
      - ".github/workflows/v3-independent.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verifier dependency
        run: python -m pip install 'cryptography>=42,<48'
      - name: Validate APK identity
        run: echo '38a9010600bc91fd468701f53ba37ea0d43cb8e906544d0700a799f592011428  original/SystemHelper.apk' | sha256sum -c -
      - name: Independently verify v3 content digest and signer signatures
        run: python tools/verify_v3_signers.py
      - name: Commit verification receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/verification/v3-independent.json
          if ! git diff --cached --quiet; then
            git commit -m 'verification: record both API-ranged cryptographic v3 signers'
            git push origin HEAD:main
          fi
