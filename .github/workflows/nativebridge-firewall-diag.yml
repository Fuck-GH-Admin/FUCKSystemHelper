name: Android 35 guest firewall diagnostics (NO APK)
on:
  push:
    branches:
      - work/native-runtime-audit-20261111
    paths:
      - .github/workflows/nativebridge-firewall-diag.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firewall:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enable KVM group permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Boot guest and inspect guest-only OUTPUT firewall rules, no sample run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 3072M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash tools/nativebridge_firewall_diagnostic.sh
