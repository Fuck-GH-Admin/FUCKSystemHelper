name: Read-only Android 35 Native Bridge qualification
on:
  push:
    branches:
      - work/native-runtime-audit-20261111
    paths:
      - .github/workflows/nativebridge-qualification.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify-api35-x86-native-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository without stored credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enable KVM group permissions on runner
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Emulator property inspection only; never install or start sample APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash tools/nativebridge_qualification.sh
      - name: Upload non-identifying T1 qualification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systemhelper-api35-nativebridge-qualification-no-apk
          path: analysis/malware/runtime/arm64/qualification-api35.json
          if-no-files-found: warn
          retention-days: 7
